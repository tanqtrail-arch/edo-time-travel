  <!-- window.storage polyfill (localStorage) -->
  <script>
  (function() {
    var PREFIX = "trail-edo-";
    window.storage = {
      get: function(key) {
        return new Promise(function(resolve) {
          try {
            var v = localStorage.getItem(PREFIX + key);
            resolve(v !== null ? { key: key, value: v } : null);
          } catch(e) { resolve(null); }
        });
      },
      set: function(key, value, shared) {
        return new Promise(function(resolve) {
          try { localStorage.setItem(PREFIX + key, value); resolve({ key: key, value: value }); }
          catch(e) { resolve(null); }
        });
      },
      delete: function(key) {
        return new Promise(function(resolve) {
          try { localStorage.removeItem(PREFIX + key); resolve({ key: key, deleted: true }); }
          catch(e) { resolve(null); }
        });
      },
      list: function(prefix) {
        return new Promise(function(resolve) {
          var keys = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.startsWith(PREFIX)) {
              var s = k.slice(PREFIX.length);
              if (!prefix || s.startsWith(prefix)) keys.push(s);
            }
          }
          resolve({ keys: keys });
        });
      }
    };
  })();
  </script>

// Ranking helpers
const WEEK_KEY=(stg)=>`rank-w-${stg}`;const PERM_KEY=(stg)=>`rank-p-${stg}`;
function getWeekStart(){const now=new Date();const d=now.getDay();const diff=(d===0?6:d-1);const mon=new Date(now);mon.setDate(now.getDate()-diff);mon.setHours(4,0,0,0);if(now<mon)mon.setDate(mon.getDate()-7);return mon.getTime();}
function calcPts(altTotal,timeSec,isPerfectQ,isNoDmg){
  const altPts=altTotal*40;// max 10ALT*40=400 (no firstClear bonus in ranking)
  const timePts=Math.max(0,300-Math.max(0,timeSec-60)*2);
  const noDmgPts=isNoDmg?200:0;
  const perfectPts=isPerfectQ?100:0;
  return Math.round(altPts+timePts+noDmgPts+perfectPts);
}
async function loadRank(stg,type){try{const k=type==="weekly"?WEEK_KEY(stg):PERM_KEY(stg);const r=await window.storage.get(k);if(!r)return[];const d=JSON.parse(r.value);if(type==="weekly"){const ws=getWeekStart();if(d.weekStart!==ws)return[];return d.entries||[];}return d||[];}catch{return[];}}
async function saveRank(stg,type,entries){try{const k=type==="weekly"?WEEK_KEY(stg):PERM_KEY(stg);if(type==="weekly"){await window.storage.set(k,JSON.stringify({weekStart:getWeekStart(),entries}),true);}else{await window.storage.set(k,JSON.stringify(entries),true);}}catch(e){console.error("save rank error",e);}}
async function registerScore(stg,name,pts,altTotal,timeSec){
  for(const type of["weekly","permanent"]){
    let entries=await loadRank(stg,type);
    const existing=entries.findIndex(e=>e.name===name);
    if(existing>=0){if(entries[existing].pts>=pts)continue;entries[existing]={name,pts,alt:altTotal,time:timeSec,date:Date.now()};}
    else{entries.push({name,pts,alt:altTotal,time:timeSec,date:Date.now()});}
    entries.sort((a,b)=>b.pts-a.pts);entries=entries.slice(0,10);
    await saveRank(stg,type,entries);
  }
}

function bfs(m,sr,sc,er,ec){if(sr===er&&sc===ec)return[];const v=Array.from({length:ROWS},()=>Array(COLS).fill(false));const q=[[sr,sc,[]]];v[sr][sc]=true;while(q.length){const[r,c,p]=q.shift();for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){const nr=r+dr,nc=c+dc;if(nr<0||nr>=ROWS||nc<0||nc>=COLS||v[nr][nc]||m[nr][nc]===1)continue;const np=[...p,{row:nr,col:nc}];if(nr===er&&nc===ec)return np;v[nr][nc]=true;q.push([nr,nc,np]);}}return null;}
function dist(a,b,c,d){return Math.abs(a-c)+Math.abs(b-d)}
function chaseStep(m,yr,yc,pr,pc){let b=null,bd=999;for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){const nr=yr+dr,nc=yc+dc;if(nr<0||nr>=ROWS||nc<0||nc>=COLS||m[nr][nc]===1)continue;const d=dist(nr,nc,pr,pc);if(d<bd){bd=d;b={r:nr,c:nc};}}return b||{r:yr,c:yc};}

const omaRef=useRef(hasOma);const goRef=useRef(gameOver);const qRef=useRef(quiz);const fRef=useRef(facing);
useEffect(()=>{posRef.current=pos},[pos]);
useEffect(()=>{visRef.current=visited},[visited]);
useEffect(()=>{smokeRef.current=smokeLeft},[smokeLeft]);
useEffect(()=>{omaRef.current=hasOma},[hasOma]);
useEffect(()=>{goRef.current=gameOver},[gameOver]);
useEffect(()=>{qRef.current=quiz},[quiz]);
useEffect(()=>{fRef.current=facing},[facing]);
useEffect(()=>{invRef.current=invincible},[invincible]);

const si=SI[stg],maze=MAZES[stg],cps=si.cps,qz=si.qz;

const buildYk=(s)=>{const info=SI[s],m=MAZES[s],yk=[];
  info.patrol.forEach(p=>yk.push({...p,type:"patrol",mode:"patrol",dead:false,scared:0,hp:1,patrolIdx:0,row:p.patrol[0].r,col:p.patrol[0].c,speed:1000}));
  info.chase.forEach(c=>{let sr=7,sc=6;for(let r=ROWS-2;r>0;r--)for(let cl=COLS-2;cl>0;cl--)if(m[r][cl]!==1&&dist(r,cl,0,0)>4){sr=r;sc=cl;break;}
    yk.push({...c,type:"chase",mode:"patrol",dead:false,scared:0,patrolIdx:0,row:sr,col:sc,patrol:[{r:sr,c:sc}]});});
  return yk;};

const startStage=(s)=>{setStg(s);setPos({row:0,col:0});setVisited(new Set());setQuiz(null);setSelAns(null);setShowRes(false);setShowDet(false);
  setScore(0);setDmgCount(0);setMoves(0);setTrail([{row:0,col:0}]);setPhase("intro");setIntro(0);setScreen("game");
  animRef.current=false;setYokai(buildYk(s));setWeapons([]);setKatUses(0);setGunAmmo(0);
  setSmokeLeft(0);setHasOma(false);setLives(3);setGameOver(false);setWpnGet(null);setSlashFx(null);setGunFx(null);setWrongCt(0);setFacing("down");setDmgFlash(false);setDmgPop(null);setLastSave({row:0,col:0});setSavedSet(new Set());setInvincible(false);setTimer(0);setRankPhase("none");setRankData([]);setMyRank(null);setResultPts(0);};

// Intro
useEffect(()=>{if(screen!=="game"||phase!=="intro")return;
  const t0=setTimeout(()=>setIntro(1),1500),t1=setTimeout(()=>setIntro(2),3500),t2=setTimeout(()=>{setIntro(3);setPhase("playing");},5000);
  return()=>{clearTimeout(t0);clearTimeout(t1);clearTimeout(t2);};
},[screen,phase]);

// Timer
useEffect(()=>{if(screen!=="game"||phase!=="playing"||gameOver)return;
  const iv=setInterval(()=>{if(!goRef.current&&!qRef.current)setTimer(t=>t+1);},1000);
  return()=>clearInterval(iv);
},[screen,phase,gameOver]);

// Patrol timer 1s
useEffect(()=>{if(screen!=="game"||phase!=="playing")return;
  const iv=setInterval(()=>{if(goRef.current||qRef.current)return;
    setYokai(p=>p.map(y=>{if(y.dead||y.type!=="patrol")return y;if(y.scared>0)return{...y,scared:y.scared-1,mode:"scared"};
      const ni=(y.patrolIdx+1)%y.patrol.length;const t=y.patrol[ni];return{...y,row:t.r,col:t.c,patrolIdx:ni,mode:"patrol"};}));},1000);
  return()=>clearInterval(iv);},[screen,phase]);

// Chase timers (per yokai speed)
useEffect(()=>{if(screen!=="game"||phase!=="playing")return;
  const ivs=[];
  yokai.filter(y=>y.type==="chase"&&!y.dead).forEach(cy=>{
    const iv=setInterval(()=>{if(goRef.current||qRef.current)return;
      const pr=posRef.current.row,pc=posRef.current.col;
      setYokai(p=>p.map(y=>{if(y.id!==cy.id||y.dead)return y;if(y.scared>0)return{...y,scared:y.scared-1,mode:"scared"};
        if(dist(y.row,y.col,pr,pc)<=y.range){const n=chaseStep(maze,y.row,y.col,pr,pc);return{...y,row:n.r,col:n.c,mode:"chase"};}
        const ds=[[-1,0],[1,0],[0,-1],[0,1]].filter(([dr,dc])=>{const nr=y.row+dr,nc=y.col+dc;return nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&maze[nr][nc]!==1;});
        if(ds.length){const[dr,dc]=ds[Math.floor(Math.random()*ds.length)];return{...y,row:y.row+dr,col:y.col+dc,mode:"patrol"};}return y;}));
    },cy.speed);ivs.push(iv);});
  return()=>ivs.forEach(clearInterval);
},[screen,phase,maze,yokai.filter(y=>y.type==="chase"&&!y.dead).map(y=>y.id).join()]);

// Collision
useEffect(()=>{if(phase!=="playing"||gameOver||quiz||smokeLeft>0||invincible)return;
  const hit=yokai.find(y=>!y.dead&&y.scared<=0&&y.row===pos.row&&y.col===pos.col);if(!hit)return;
  if(omaRef.current){setHasOma(false);setDmgFlash(true);setTimeout(()=>setDmgFlash(false),600);
    setDmgPop({row:pos.row,col:pos.col,blocked:true});setTimeout(()=>setDmgPop(null),1200);return;}
  setLives(l=>{const n=l-1;if(n<=0)setTimeout(()=>setGameOver(true),800);return n;});
  setDmgCount(d=>d+1);
  setDmgFlash(true);setTimeout(()=>setDmgFlash(false),800);
  setDmgPop({row:pos.row,col:pos.col,blocked:false});setTimeout(()=>setDmgPop(null),1200);
  // Invincibility + respawn at last save
  setInvincible(true);
  setTimeout(()=>{setPos({row:lastSave.row,col:lastSave.col});},400);
  setTimeout(()=>setInvincible(false),2000);
},[yokai,pos,phase,gameOver,quiz,smokeLeft,invincible,lastSave]);

const doStep=useCallback((nr,nc)=>{setPos({row:nr,col:nc});setMoves(m=>m+1);setTrail(t=>[...t,{row:nr,col:nc}]);
  if(smokeLeft>0)setSmokeLeft(s=>s-1);const cell=maze[nr][nc];
  // Check save points
  const sv=si.saves.find(s=>s.row===nr&&s.col===nc);
  if(sv&&!savedSet.has(`${nr}-${nc}`)){setLastSave({row:nr,col:nc});setSavedSet(p=>new Set([...p,`${nr}-${nc}`]));}
  if(cell===2){const cp=cps.find(c=>c.row===nr&&c.col===nc);if(cp&&!visited.has(cp.id))setTimeout(()=>setQuiz(cp.id),300);}
  if(cell===3&&visited.size===4){if(stg<3)setTimeout(()=>setScreen("stageClear"),500);else setTimeout(()=>setScreen("complete"),500);}
},[smokeLeft,visited,maze,cps,stg,si.saves,savedSet]);

const handleMove=useCallback((dr,dc)=>{if(quiz||phase!=="playing"||animRef.current||gameOver)return;
  setFacing(dr===-1?"up":dr===1?"down":dc===-1?"left":"right");
  const nr=pos.row+dr,nc=pos.col+dc;
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS||maze[nr][nc]===1){setShake(true);setTimeout(()=>setShake(false),300);return;}
  doStep(nr,nc);},[pos,quiz,phase,doStep,gameOver,maze]);

const handleClick=useCallback((row,col)=>{if(quiz||phase!=="playing"||animRef.current||gameOver)return;
  if(maze[row][col]===1)return;if(row===pos.row&&col===pos.col)return;
  const path=bfs(maze,pos.row,pos.col,row,col);if(!path||!path.length)return;
  animRef.current=true;let i=0;
  const step=()=>{if(i>=path.length||goRef.current){animRef.current=false;return;}const n=path[i];
    if(i>0||true){const pv=i>0?path[i-1]:pos;setFacing(n.row<pv.row?"up":n.row>pv.row?"down":n.col<pv.col?"left":"right");}
    doStep(n.row,n.col);const cell=maze[n.row][n.col];
    if(cell===2){const cp=cps.find(c=>c.row===n.row&&c.col===n.col);if(cp&&!visRef.current.has(cp.id)){animRef.current=false;return;}}
    if(cell===3&&visRef.current.size===4){animRef.current=false;return;}
    i++;setTimeout(step,120);};step();
},[pos,quiz,phase,doStep,gameOver,maze,cps]);

useEffect(()=>{if(screen!=="game")return;
  const h=e=>{const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],w:[-1,0],s:[1,0],a:[0,-1],d:[0,1]};const d=m[e.key];if(d){e.preventDefault();handleMove(d[0],d[1]);}};
  window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);},[screen,handleMove]);

const useWpn=(w)=>{if(phase!=="playing"||quiz||gameOver)return;
  if(w==="katana"&&katUses>0){let near=null,nd=999;yokai.forEach(y=>{if(y.dead||y.scared>0)return;const d=dist(pos.row,pos.col,y.row,y.col);if(d<nd&&d<=1){nd=d;near=y;}});
    if(near){setKatUses(u=>u-1);setSlashFx({row:near.row,col:near.col});setTimeout(()=>{setYokai(p=>p.map(y=>y.id!==near.id?y:y.hp-1<=0?{...y,dead:true}:{...y,hp:y.hp-1}));setSlashFx(null);},400);}}
  else if(w==="tanegashima"&&gunAmmo>0){const ds={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]},[dr,dc]=ds[facing];
    let tr=pos.row+dr,tc=pos.col+dc,tgt=null;const bp=[];
    while(tr>=0&&tr<ROWS&&tc>=0&&tc<COLS&&maze[tr][tc]!==1){bp.push({row:tr,col:tc});const h=yokai.find(y=>!y.dead&&y.row===tr&&y.col===tc);if(h){tgt=h;break;}tr+=dr;tc+=dc;}
    setGunAmmo(a=>a-1);setGunFx({path:bp,tid:tgt?.id});setTimeout(()=>{if(tgt)setYokai(p=>p.map(y=>y.id!==tgt.id?y:y.hp-1<=0?{...y,dead:true}:{...y,hp:y.hp-1}));setGunFx(null);},350);}
  else if(w==="smoke"&&weapons.includes("smoke")){setWeapons(ww=>{const i=ww.indexOf("smoke");const n=[...ww];n.splice(i,1);return n;});setSmokeLeft(5);}
  else if(w==="omamori"&&weapons.includes("omamori")){setWeapons(ww=>{const i=ww.indexOf("omamori");const n=[...ww];n.splice(i,1);return n;});setHasOma(true);}
  else if(w==="inro"&&weapons.includes("inro")){setWeapons(ww=>{const i=ww.indexOf("inro");const n=[...ww];n.splice(i,1);return n;});
    setYokai(p=>p.map(y=>y.dead?y:dist(pos.row,pos.col,y.row,y.col)<=3?{...y,scared:12}:y));}};

const handleAns=(idx)=>{if(showRes)return;setSelAns(idx);setShowRes(true);const info=qz[quiz];const cpI=cps.findIndex(c=>c.id===quiz);
  if(idx===info.ans){setScore(s=>s+25);setVisited(v=>new Set([...v,quiz]));
    const wpn=si.wpnOrder[cpI%si.wpnOrder.length];
    if(wpn==="katana"){setKatUses(u=>u+3);setWpnGet("katana");}
    else if(wpn==="tanegashima"){setGunAmmo(a=>a+3);setWpnGet("tanegashima");}
    else{setWeapons(ww=>[...ww,wpn]);setWpnGet(wpn);}
  }else{setWrongCt(prev=>{if(prev<EXTRA.length){const ey=EXTRA[prev];
    const wk=[];maze.forEach((row,rI)=>row.forEach((c,cI)=>{if(c!==1&&dist(rI,cI,pos.row,pos.col)>3)wk.push({r:rI,c:cI});}));
    if(wk.length){const sp=wk[Math.floor(Math.random()*wk.length)];const nb=wk.filter(w=>dist(w.r,w.c,sp.r,sp.c)<=2);
      const pt=nb.length>=2?nb.slice(0,4).map(w=>({r:w.r,c:w.c})):[sp,sp];
      setYokai(yk=>[...yk,{...ey,id:"ex"+prev,type:"patrol",mode:"patrol",dead:false,scared:0,hp:1,patrolIdx:0,row:sp.r,col:sp.c,speed:1000,patrol:pt}]);}}return prev+1;});}};

const closeQuiz=()=>{if(!showRes)return;if(selAns!==qz[quiz].ans)setVisited(v=>new Set([...v,quiz]));
  setQuiz(null);setSelAns(null);setShowRes(false);setShowDet(false);setWpnGet(null);gameRef.current?.focus();};

const CSS=`@import url('https://fonts.googleapis.com/css2?family=Zen+Antique&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes cpGlow{0%,100%{filter:drop-shadow(0 0 4px ${C.beni}44)}50%{filter:drop-shadow(0 0 12px ${C.beni}aa)}}
@keyframes goalGlow{0%,100%{filter:drop-shadow(0 0 4px ${C.gold}66)}50%{filter:drop-shadow(0 0 16px ${C.gold}ff)}}
@keyframes bounce{0%,100%{transform:scale(1)}30%{transform:scale(1.25)}60%{transform:scale(.92)}}
@keyframes brushReveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0% 0 0)}}
@keyframes inkDrop{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
@keyframes petal{0%{transform:translateY(0) rotate(0);opacity:.7}100%{transform:translateY(100vh) rotate(360deg);opacity:0}}
@keyframes yFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes scared{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.45;transform:scale(.85)}}
@keyframes dmgF{0%,100%{background:transparent}30%{background:rgba(197,61,67,0.35)}}
@keyframes dmgPop{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
@keyframes hurt{0%{transform:translateY(0)}15%{transform:translate(-4px,-2px)}30%{transform:translate(4px,2px)}100%{transform:translateY(0)}}
@keyframes wpnPop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes smokeA{0%,100%{box-shadow:0 0 8px rgba(180,180,180,.3)}50%{box-shadow:0 0 20px rgba(180,180,180,.7)}}
@keyframes omaS{0%,100%{box-shadow:0 0 6px rgba(107,142,90,.3)}50%{box-shadow:0 0 16px rgba(107,142,90,.7)}}
@keyframes slashA{0%{transform:rotate(-45deg) scale(0);opacity:1}50%{transform:rotate(15deg) scale(1.3);opacity:1}100%{transform:rotate(30deg) scale(.5);opacity:0}}
@keyframes slashF{0%{background:rgba(255,215,75,.5)}100%{background:transparent}}
@keyframes chaseG{0%,100%{filter:drop-shadow(0 0 3px rgba(197,61,67,.3))}50%{filter:drop-shadow(0 0 10px rgba(197,61,67,.8))}}
@keyframes bulletF{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3)}}
@keyframes invBlink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes saveGlow{0%,100%{filter:drop-shadow(0 0 3px rgba(107,142,90,.3))}50%{filter:drop-shadow(0 0 10px rgba(107,142,90,.8))}}
@keyframes slideIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}`;

const Pet=()=><div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:0,overflow:"hidden"}}>{[...Array(6)].map((_,i)=><div key={i} style={{position:"absolute",left:`${10+i*15}%`,top:"-20px",fontSize:`${12+(i%3)*4}px`,animation:`petal ${8+i*2}s linear ${i*1.5}s infinite`,opacity:.5}}>🌸</div>)}</div>;
const Dv=()=><div style={{width:100,height:3,margin:"12px auto",background:`linear-gradient(90deg,transparent,${C.beni},transparent)`,borderRadius:2}}/>;

if(screen==="title")return(

</div></div>);

// ===== STAGE CLEAR =====
if(screen==="stageClear"){
const isPerfectQ=score===100;const isNoDmg=dmgCount===0;const isFirst=!firstClear.has(stg);
const altBase=3;const altQuiz=isPerfectQ?3:0;const altNoDmg=isNoDmg?4:0;const altFirst=isFirst?5:0;
const altTotal=altBase+altQuiz+altNoDmg+altFirst;
const altForRank=altBase+altQuiz+altNoDmg;// exclude first clear bonus from ranking pts
const pts=calcPts(altForRank,timer,isPerfectQ,isNoDmg);
const doRegister=async()=>{if(!rankName.trim())return;
  await registerScore(stg,rankName.trim(),pts,altTotal,timer);
  const wk=await loadRank(stg,"weekly");setRankData(wk);
  const idx=wk.findIndex(e=>e.name===rankName.trim());setMyRank(idx>=0?idx+1:null);
  if(isFirst)setFirstClear(p=>new Set([...p,stg]));setRankPhase("done");};
return(
<div style={app}><style>{CSS}</style><Pet/>

        <div><div style={{fontSize:16,fontWeight:700,color:C.ai}}>⏱️{Math.floor(timer/60)}:{String(timer%60).padStart(2,"0")}</div><div style={{fontSize:9,color:C.wood}}>タイム</div></div>

        <div style={{display:"flex",justifyContent:"space-between",fontSize:11}}><span style={{color:isNoDmg?C.matcha:C.kincha}}>{isNoDmg?"✅":"❌"} ノーダメ</span><span style={{color:isNoDmg?C.gold:C.kincha,fontWeight:700}}>{isNoDmg?`+${altNoDmg}`:"+0"}</span></div>
        {isFirst&&<div style={{display:"flex",justifyContent:"space-between",fontSize:11}}><span style={{color:C.matcha}}>🆕 初クリア</span><span style={{color:C.gold,fontWeight:700}}>+{altFirst}</span></div>}
      </div>

        <span style={{fontSize:13,fontWeight:900}}>合計</span>

      {isGun&&<div style={{position:"absolute",width:8,height:8,borderRadius:"50%",background:C.gold,zIndex:8,animation:"bulletF .35s ease-out",boxShadow:`0 0 6px ${C.gold}`}}/>}
      {dmgPop&&dmgPop.row===rI&&dmgPop.col===cI&&<div style={{position:"absolute",zIndex:20,animation:"dmgPop 1.2s ease-out forwards",pointerEvents:"none"}}>{dmgPop.blocked?<div style={{fontSize:18}}>🛡️</div>:<div style={{fontSize:14,fontWeight:900,color:C.beni,textShadow:`0 0 6px ${C.cream}`}}>-1 ❤️</div>}</div>}
      {isP&&<div style={{fontSize:22,zIndex:5,animation:`${dmgFlash?"hurt .5s ease-out":invincible?"invBlink .3s ease-in-out infinite":"bob 1.5s ease-in-out infinite"}${smokeLeft>0?", smokeA 1s ease-in-out infinite":""}${hasOma?", omaS 1.5s ease-in-out infinite":""}`,filter:`drop-shadow(0 0 6px ${dmgFlash?C.beni:C.beni+"80"})`,opacity:smokeLeft>0?.5:1,borderRadius:"50%"}}>🥷</div>}
    </div>);}))}
</div></div></div>

{/* Bottom panel */}
{phase==="playing"&&!gameOver&&<div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:10,background:`linear-gradient(180deg,transparent,${C.cream}ee 12px,${C.cream} 20px)`,paddingTop:14,paddingBottom:10}}>
  <div style={{display:"flex",justifyContent:"center",gap:6,marginBottom:6,padding:"0 8px",flexWrap:"wrap"}}>
    {katUses>0&&<button onClick={()=>useWpn("katana")} style={{background:`linear-gradient(180deg,${C.cream},${C.washi})`,border:`2px solid ${C.kincha}`,borderRadius:8,padding:"6px 12px",cursor:"pointer",fontFamily:"inherit",fontSize:13,display:"flex",alignItems:"center",gap:4,boxShadow:"0 2px 8px rgba(0,0,0,.12)",minWidth:70,justifyContent:"center"}}>🗡️刀<span style={{fontSize:10,color:C.beni}}>x{katUses}</span></button>}
    {gunAmmo>0&&<button onClick={()=>useWpn("tanegashima")} style={{background:`linear-gradient(180deg,${C.cream},${C.washi})`,border:`2px solid ${C.kincha}`,borderRadius:8,padding:"6px 12px",cursor:"pointer",fontFamily:"inherit",fontSize:13,display:"flex",alignItems:"center",gap:4,boxShadow:"0 2px 8px rgba(0,0,0,.12)",minWidth:70,justifyContent:"center"}}>🔫銃<span style={{fontSize:10,color:C.beni}}>x{gunAmmo}</span></button>}
    {weapons.filter(w=>w!=="katana"&&w!=="tanegashima").map((w,i)=><button key={`${w}${i}`} onClick={()=>useWpn(w)} style={{background:`linear-gradient(180deg,${C.cream},${C.washi})`,border:`2px solid ${C.kincha}`,borderRadius:8,padding:"6px 12px",cursor:"pointer",fontFamily:"inherit",fontSize:13,display:"flex",alignItems:"center",gap:4,boxShadow:"0 2px 8px rgba(0,0,0,.12)",minWidth:70,justifyContent:"center"}}>{WPN[w].e}{WPN[w].n}</button>)}
    {katUses<=0&&gunAmmo<=0&&weapons.length===0&&<span style={{fontSize:11,color:C.kincha,padding:"6px 0"}}>関所で正解→道具GET！</span>}
  </div>
  <div style={{display:"flex",justifyContent:"center",gap:12,alignItems:"center",padding:"4px 8px"}}>
    <div style={{fontSize:11,color:C.wood}}>{!allV?`残り${4-visited.size}関所`:<span style={{color:C.beni,fontWeight:700}}>⛩️出口へ！</span>}</div>
    {smokeLeft>0&&<span style={{fontSize:10,color:"#5aa"}}>💨残{smokeLeft}</span>}
    {hasOma&&<span style={{fontSize:10,color:C.matcha}}>🛡️守護</span>}
    <span style={{fontSize:9,color:C.kincha}}>向き:{facing==="up"?"↑":facing==="down"?"↓":facing==="left"?"←":"→"}</span>
  </div>
</div>}

{/* Quiz */}
{quiz&&qi&&<div style={{position:"fixed",inset:0,background:`${C.sumi}cc`,display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}}>
<div style={{animation:"fadeInUp .4s ease-out",background:`linear-gradient(180deg,${C.cream},${C.washi})`,border:`3px solid ${C.woodDk}`,borderRadius:4,padding:"24px 20px",maxWidth:420,width:"100%",maxHeight:"90vh",overflowY:"auto",boxShadow:"0 8px 32px rgba(0,0,0,.3)"}}>
  <div style={{textAlign:"center",marginBottom:14}}><span style={{fontSize:32}}>{qi.emoji}</span><h3 style={{fontSize:20,color:C.sumi,marginTop:4,fontWeight:900,letterSpacing:4}}>{qi.name}</h3></div>
  <div style={{background:`${C.ai}10`,border:`1px solid ${C.ai}30`,borderRadius:6,padding:12,marginBottom:12}}><p style={{fontSize:14,fontWeight:700,color:C.sumi,lineHeight:1.7}}>❓ {qi.q}</p></div>
  <div style={{display:"flex",flexDirection:"column",gap:6}}>
    {qi.opts.map((o,i)=>{let bg=C.washi,bd=`1px solid ${C.kincha}30`,cl=C.sumi;
      if(showRes){if(i===qi.ans){bg=`${C.matcha}25`;bd=`2px solid ${C.matcha}`;cl=C.matcha;}else if(i===selAns){bg=`${C.beni}15`;bd=`2px solid ${C.beni}`;cl=C.beni;}}
      const op=(showRes&&i!==qi.ans&&i!==selAns)?0.35:1;
      return(<button key={i} onClick={()=>handleAns(i)} style={{background:bg,border:bd,color:cl,borderRadius:6,padding:"10px 12px",fontSize:13,cursor:showRes?"default":"pointer",fontFamily:"inherit",textAlign:"left",transition:"all .2s",opacity:op}}>
        <span style={{color:C.beni,marginRight:8,fontWeight:700}}>{["イ","ロ","ハ","ニ"][i]}</span>{o}</button>);})}
  </div>
  {showRes&&(<div style={{marginTop:12,animation:"fadeInUp .3s ease-out"}}>
    <div style={{padding:"4px 12px",borderRadius:4,display:"inline-block",fontSize:13,fontWeight:700,marginBottom:8,background:selAns===qi.ans?`${C.matcha}20`:`${C.beni}15`,color:selAns===qi.ans?C.matcha:C.beni,border:`1px solid ${selAns===qi.ans?C.matcha:C.beni}`}}>{selAns===qi.ans?"🎉 正解！ +25点":"😢 残念…"}</div>
    {selAns===qi.ans&&wpnGet&&(<div style={{animation:"wpnPop .5s ease-out",background:`${C.gold}15`,border:`2px solid ${C.gold}`,borderRadius:8,padding:"10px 14px",marginBottom:10,textAlign:"center"}}>
      <div style={{fontSize:24}}>{WPN[wpnGet].e}</div><div style={{fontSize:13,fontWeight:700,color:C.gold,marginTop:2}}>「{WPN[wpnGet].n}」獲得！</div><div style={{fontSize:11,color:C.wood,marginTop:2}}>{WPN[wpnGet].u}</div>
      {(wpnGet==="katana"||wpnGet==="tanegashima")&&<div style={{fontSize:10,color:C.beni,marginTop:2}}>（{wpnGet==="katana"?"3回斬れる":"弾3発"}）</div>}
    </div>)}
    {selAns!==qi.ans&&(<div style={{background:`${C.beni}08`,border:`1px dashed ${C.beni}30`,borderRadius:6,padding:8,marginBottom:10,fontSize:11,color:C.wood,textAlign:"center"}}>武器なし…<span style={{color:C.beni,fontWeight:700}}>👹妖怪+1！</span></div>)}
    {showDet?(<div style={{animation:"fadeInUp .3s ease-out",background:`${C.ai}06`,border:`1px solid ${C.ai}15`,borderRadius:6,padding:12,fontSize:12,color:C.ink,lineHeight:1.9,marginBottom:10}}>{qi.detail}</div>
    ):(<button onClick={()=>setShowDet(true)} style={{display:"block",width:"100%",background:`${C.ai}08`,border:`1px solid ${C.ai}25`,borderRadius:6,padding:8,color:C.ai,fontSize:12,cursor:"pointer",fontFamily:"inherit",marginBottom:10}}>📖 くわしく知る</button>)}
    <button onClick={closeQuiz} style={{width:"100%",background:C.beni,color:C.cream,border:`2px solid ${C.beniDk}`,borderRadius:4,padding:10,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",letterSpacing:4}}>先へ進む →</button>
  </div>)}
</div></div>}
</div>);}

window.__EdoApp = EdoTimeTravel;
  </script>

  <!-- Mount -->
  <script type="text/babel" data-presets="react">
    ReactDOM.createRoot(document.getElementById("root")).render(
      React.createElement(window.__EdoApp)
    );
  </script>
</body>
</html>

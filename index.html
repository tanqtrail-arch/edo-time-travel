<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⛩️ 江戸時代タイムトラベル | 探究教室TRAIL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #1a1208; font-family: 'Noto Serif JP', serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="trail-nav.js"></script> <!-- 🆕 TRAIL共通ナビ -->
  <script src="./bundle.js"></script>
  <!-- ===== 🆕 TRAIL共通ナビ初期化 ===== -->
  <script>
  TrailNav.init({
    gameName: '時代迷路',
    gameEmoji: '⏳',
    gameHomeId: 'root',
    tgp32Url: 'https://trail-game-pro-3-2.onrender.com',
    apiBase:  'https://trail-game-pro-3-2.onrender.com/api',
  });
  // bundle.jsはビルド済みのため、MutationObserverでゲーム状態変化を監視
  window.showGameHome = function() {
    if (confirm('ゲームを中断してホームに戻りますか？')) {
      if (typeof TrailNav !== 'undefined') { TrailNav.flushAltWithRetry(); TrailNav.showNav(); }
      location.reload();
    }
  };
  </script>
</body>
</html>
